<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>馬字歌 - 情景互動識字遊戲</title>
<script src="https://aisearch-task.bj.bcebos.com/static/tailwindcss-3.4.17.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap');

:root {
  --watercolor-pink: #f8b4c4;
  --watercolor-blue: #a8d8ea;
  --watercolor-yellow: #ffeaa7;
  --watercolor-green: #b8e0c8;
  --watercolor-orange: #fdd5b5;
  --watercolor-purple: #d5b8e0;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'ZCOOL KuaiLe', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  background: linear-gradient(135deg, #fef9f3 0%, #fff5e6 50%, #f0f9ff 100%);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

.handwrite {
  font-family: 'Ma Shan Zheng', 'KaiTi', 'STKaiti', serif;
}

.watercolor-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(40px);
  opacity: 0.4;
  animation: float 8s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-20px) scale(1.05); }
}

@keyframes bounce-gentle {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes wiggle {
  0%, 100% { transform: rotate(-3deg); }
  50% { transform: rotate(3deg); }
}

@keyframes sparkle {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.2); }
}

.animate-bounce-gentle {
  animation: bounce-gentle 2s ease-in-out infinite;
}

.animate-wiggle {
  animation: wiggle 1s ease-in-out infinite;
}

.animate-sparkle {
  animation: sparkle 1.5s ease-in-out infinite;
}

.hand-drawn-border {
  border: 4px solid #5d4e37;
  border-radius: 25px 20px 30px 22px / 22px 28px 20px 25px;
  box-shadow: 
    3px 3px 0 rgba(93, 78, 55, 0.1),
    inset 0 0 20px rgba(255, 255, 255, 0.5);
}

.hand-drawn-btn {
  border: 3px solid #5d4e37;
  border-radius: 20px 18px 25px 16px / 18px 22px 16px 20px;
  box-shadow: 4px 4px 0 rgba(93, 78, 55, 0.2);
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
}

.hand-drawn-btn:hover {
  transform: translate(-2px, -2px);
  box-shadow: 6px 6px 0 rgba(93, 78, 55, 0.25);
}

.hand-drawn-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 rgba(93, 78, 55, 0.2);
}

.scene-card {
  background: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(255,250,240,0.85));
  backdrop-filter: blur(10px);
}

.character-highlight {
  display: inline-block;
  position: relative;
  cursor: pointer;
  transition: all 0.3s ease;
}

.character-highlight::after {
  content: '';
  position: absolute;
  bottom: -5px;
  left: 0;
  right: 0;
  height: 8px;
  background: linear-gradient(90deg, var(--watercolor-yellow), var(--watercolor-orange));
  border-radius: 4px;
  opacity: 0;
  transition: opacity 0.3s ease;
  z-index: -1;
}

.character-highlight:hover::after,
.character-highlight.active::after {
  opacity: 0.8;
}

.character-highlight.active {
  transform: scale(1.1);
  color: #c0392b;
}

.pulse-ring {
  animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
}

@keyframes pulse-ring {
  0% { transform: scale(0.8); opacity: 1; }
  80%, 100% { transform: scale(1.3); opacity: 0; }
}

.page {
  display: none;
  animation: pageIn 0.5s ease;
}

.page.active {
  display: block;
}

@keyframes pageIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.touch-feedback {
  position: relative;
}

.big-char {
  font-size: clamp(80px, 20vw, 150px);
  line-height: 1;
  text-shadow: 
    3px 3px 0 rgba(93, 78, 55, 0.1),
    -1px -1px 0 rgba(255,255,255,0.5);
}

.poem-line {
  font-size: clamp(28px, 6vw, 52px);
}

.char-card {
  background: white;
  border: 3px dashed #e67e22;
  border-radius: 20px;
  transition: all 0.3s ease;
  cursor: pointer;
}

.char-card:hover {
  transform: translateY(-5px) rotate(2deg);
  box-shadow: 0 10px 30px rgba(230, 126, 34, 0.2);
}

.char-card.correct {
  border-color: #27ae60;
  background: #d5f5e3;
}

.char-card.wrong {
  border-color: #e74c3c;
  background: #fadbd8;
  animation: shake 0.5s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  75% { transform: translateX(10px); }
}

.heart-float {
  position: fixed;
  pointer-events: none;
  animation: heartFloat 2s ease-out forwards;
  z-index: 100;
}

@keyframes heartFloat {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
}

.reading-highlight {
  background: linear-gradient(120deg, #ffeaa7 0%, #fdcb6e 100%);
  border-radius: 10px;
  padding: 2px 8px;
}
</style>
</head>
<body class="min-h-screen relative">

<div class="relative z-10 min-h-screen flex flex-col">

  <header class="px-4 py-3 md:px-8 md:py-4">

  <div id="storyPage" class="page flex-1 flex flex-col px-4 pb-4">

      <div class="flex items-center justify-center gap-2 md:gap-4 mb-2">
        <div id="sceneDot1" class="w-4 h-4 md:w-5 md:h-5 rounded-full bg-pink-400 border-2 border-pink-600 transition-all"></div>
        <div class="w-8 md:w-16 h-1 bg-amber-200 rounded"></div>
        <div id="sceneDot2" class="w-4 h-4 md:w-5 md:h-5 rounded-full bg-gray-300 border-2 border-gray-400 transition-all"></div>
        <div class="w-8 md:w-16 h-1 bg-amber-200 rounded"></div>
        <div id="sceneDot3" class="w-4 h-4 md:w-5 md:h-5 rounded-full bg-gray-300 border-2 border-gray-400 transition-all"></div>

    <div class="flex-1 max-w-4xl mx-auto w-full">

      <button id="sceneSpeak" onclick="speakCurrentScene()" class="hand-drawn-btn bg-yellow-200 px-6 py-3 md:px-8 md:py-4 text-lg md:text-xl touch-feedback">

      <button id="nextScene" onclick="nextScene()" class="hand-drawn-btn bg-amber-200 px-6 py-3 md:px-8 md:py-4 text-lg md:text-xl touch-feedback">

  </div>

  <div id="readingPage" class="page flex-1 flex flex-col items-center justify-center px-4">

        <div id="poemContent" class="space-y-4 md:space-y-6 mb-8">
          <div class="poem-line handwrite text-amber-900 py-2 px-4 rounded-xl transition-all" data-line="0">
            我愛畫<span class="character-highlight" data-char="馬">馬</span>，
          </div>
          <div class="poem-line handwrite text-amber-900 py-2 px-4 rounded-xl transition-all" data-line="1">
            騎着白<span class="character-highlight" data-char="馬">馬</span>走天下。
          </div>
          <div class="poem-line handwrite text-amber-900 py-2 px-4 rounded-xl transition-all" data-line="2">
            我愛畫<span class="character-highlight" data-char="螞">螞</span>蟻，
          </div>
          <div class="poem-line handwrite text-amber-900 py-2 px-4 rounded-xl transition-all" data-line="3">
            小小<span class="character-highlight" data-char="螞">螞</span>蟻忙搬家。
          </div>
          <div class="poem-line handwrite text-amber-900 py-2 px-4 rounded-xl transition-all" data-line="4">
            我愛畫<span class="character-highlight" data-char="媽">媽</span>媽，
          </div>
          <div class="poem-line handwrite text-amber-900 py-2 px-4 rounded-xl transition-all" data-line="5">
            <span class="character-highlight" data-char="媽">媽</span>媽愛我我愛她。
          </div>
        </div>

        <div class="flex flex-wrap justify-center gap-4">

            ▶️ 播放全文
          </button>
          <button id="stopBtn" onclick="stopReading()" class="hand-drawn-btn bg-red-200 px-6 py-4 text-xl md:text-2xl touch-feedback">

          </button>

        <p class="mt-6 text-amber-600 text-base md:text-lg">
          💡 點擊個別字詞可以聽讀音哦！

      </div>

      <div class="text-center mt-6">
        <button onclick="goHome()" class="hand-drawn-btn bg-gray-100 px-6 py-3 text-lg touch-feedback">

        </button>
      </div>
    </div>
  </div>

  <div id="gamePage" class="page flex-1 flex flex-col px-4 pb-4">
    <div class="max-w-4xl mx-auto w-full mb-4">
      <div class="flex justify-between items-center hand-drawn-border bg-white/80 px-4 py-3 md:px-6 md:py-4">
        <div class="flex items-center gap-2">
          <span class="text-2xl md:text-3xl">⭐</span>
          <span id="gameScore" class="handwrite text-2xl md:text-3xl text-amber-700">0</span>
        </div>
        <div id="gameLevel" class="handwrite text-xl md:text-2xl text-green-700">第一關：認識部首</div>
        <div class="flex items-center gap-2">
          <span class="text-2xl md:text-3xl">❓</span>
          <span id="gameProgress" class="handwrite text-xl md:text-2xl text-blue-700">1/5</span>
        </div>
      </div>
    </div>

    <div class="flex-1 max-w-4xl mx-auto w-full">
      <div id="gameContainer" class="hand-drawn-border scene-card p-4 md:p-8 min-h-[450px] md:min-h-[550px] flex flex-col items-center justify-center">
      </div>
    </div>

    <div class="max-w-4xl mx-auto w-full mt-4">
      <div id="gameFeedback" class="text-center handwrite text-xl md:text-2xl text-amber-700 min-h-[40px]">
        選出正確的答案吧！
      </div>
      <div class="flex justify-center mt-4">
        <button onclick="restartGame()" class="hand-drawn-btn bg-yellow-200 px-6 py-3 text-lg md:text-xl touch-feedback mr-4">
          🔄 重新開始
        </button>
        <button onclick="goHome()" class="hand-drawn-btn bg-gray-100 px-6 py-3 text-lg md:text-xl touch-feedback">

<div id="soundOverlay" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[9999] hidden" onclick="initAudio()">
  <div class="bg-white rounded-3xl p-8 text-center max-w-sm mx-4 hand-drawn-border">
    <div class="text-6xl mb-4">🔊</div>
    <h3 class="handwrite text-2xl text-amber-700 mb-2">開啟音效</h3>
    <p class="text-amber-600 mb-4">點擊任意地方開始遊戲<br>體驗完整音效與朗讀功能</p>
    <button class="hand-drawn-btn bg-yellow-300 px-8 py-4 text-xl mt-2" onclick="event.stopPropagation(); initAudio()">開始遊戲 🎮</button>
  </div>
</div>

<script>
let audioContext = null;
let soundEnabled = true;
let currentScene = 0;
let isReading = false;
let readingUtterance = null;
let gameScore = 0;
let currentGameLevel = 0;
let currentQuestionIndex = 0;

function initAudio() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  document.getElementById('soundOverlay').style.display = 'none';
  playSound('welcome');
}

function playSound(type) {
  if (!soundEnabled || !audioContext) return;
  
  const now = audioContext.currentTime;
  
  switch(type) {
    case 'click':
      var osc = audioContext.createOscillator();
      var gain = audioContext.createGain();
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
      break;
    case 'correct':
      [523, 659, 784].forEach(function(freq, i) {
        var o = audioContext.createOscillator();
        var g = audioContext.createGain();
        o.connect(g);
        g.connect(audioContext.destination);
        o.frequency.setValueAtTime(freq, now + i * 0.1);
        g.gain.setValueAtTime(0.15, now + i * 0.1);
        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2);
        o.start(now + i * 0.1);
        o.stop(now + i * 0.1 + 0.2);
      });
      break;
    case 'wrong':
      var o1 = audioContext.createOscillator();
      var g1 = audioContext.createGain();
      o1.connect(g1);
      g1.connect(audioContext.destination);
      o1.frequency.setValueAtTime(200, now);
      o1.frequency.setValueAtTime(150, now + 0.1);
      g1.gain.setValueAtTime(0.1, now);
      g1.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      o1.start(now);
      o1.stop(now + 0.2);
      break;
    case 'welcome':
      [523, 659, 784, 1047].forEach(function(freq, i) {
        var o = audioContext.createOscillator();
        var g = audioContext.createGain();
        o.connect(g);
        g.connect(audioContext.destination);
        o.frequency.setValueAtTime(freq, now + i * 0.15);
        g.gain.setValueAtTime(0.1, now + i * 0.15);
        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.2);
        o.start(now + i * 0.15);
        o.stop(now + i * 0.15 + 0.2);
      });
      break;
    case 'horse':
      for(var i = 0; i < 4; i++) {
        var o = audioContext.createOscillator();
        var g = audioContext.createGain();
        o.type = 'triangle';
        o.connect(g);
        g.connect(audioContext.destination);
        o.frequency.setValueAtTime(150 + i * 20, now + i * 0.1);
        g.gain.setValueAtTime(0.08, now + i * 0.1);
        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.08);
        o.start(now + i * 0.1);
        o.stop(now + i * 0.1 + 0.08);
      }
      break;
    case 'ant':
      for(var i = 0; i < 6; i++) {
        var o = audioContext.createOscillator();
        var g = audioContext.createGain();
        o.type = 'sine';
        o.connect(g);
        g.connect(audioContext.destination);
        o.frequency.setValueAtTime(800 + Math.random() * 400, now + i * 0.05);
        g.gain.setValueAtTime(0.05, now + i * 0.05);
        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.04);
        o.start(now + i * 0.05);
        o.stop(now + i * 0.05 + 0.04);
      }
      break;
    case 'heart':
      var o = audioContext.createOscillator();
      var g = audioContext.createGain();
      o.type = 'sine';
      o.connect(g);
      g.connect(audioContext.destination);
      o.frequency.setValueAtTime(600, now);
      o.frequency.exponentialRampToValueAtTime(900, now + 0.2);
      g.gain.setValueAtTime(0.1, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      o.start(now);
      o.stop(now + 0.3);
      break;
    case 'win':
      [523, 659, 784, 1047, 784, 1047].forEach(function(freq, i) {
        var o = audioContext.createOscillator();
        var g = audioContext.createGain();
        o.connect(g);
        g.connect(audioContext.destination);
        o.frequency.setValueAtTime(freq, now + i * 0.1);
        g.gain.setValueAtTime(0.12, now + i * 0.1);
        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.15);
        o.start(now + i * 0.1);
        o.stop(now + i * 0.1 + 0.15);
      });
      break;
  }
}

function speak(text, callback) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    var utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.8;
    utterance.pitch = 1.1;
    utterance.volume = 1;
    
    var voices = window.speechSynthesis.getVoices();
    var chineseVoice = voices.find(function(v) { return v.lang.includes('zh') || v.lang.includes('CMN'); });
    if (chineseVoice) utterance.voice = chineseVoice;
    
    if (callback) {
      utterance.onend = callback;
    }
    
    readingUtterance = utterance;
    window.speechSynthesis.speak(utterance);
  }
}

function stopSpeaking() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  isReading = false;
}

      return;

    lines.forEach(function(l) { l.classList.remove('reading-highlight'); });

    speak(poemLines[lineIndex], function() {
      lineIndex++;
      setTimeout(readNextLine, 300);

  }
  
  readNextLine();

function getQuestionEmoji(question) {
  if (question.question.includes('螞')) return '🐜';
  if (question.question.includes('媽')) return '👩';
  if (question.question.includes('白')) return '🦄';
  if (question.question.includes('蟻')) return '🐜';
  if (question.question.includes('媽愛')) return '💗';
  if (question.question.includes('什麼') || question.question.includes('哪個')) return '🎯';
  return '❓';
}

function checkAnswer(selectedIndex) {
  var level = gameLevels[currentGameLevel];
  var question = level.questions[currentQuestionIndex];
  var cards = document.querySelectorAll('.char-card');
  var feedback = document.getElementById('gameFeedback');
  
  cards.forEach(function(card) { card.disabled = true; });
  
  if (selectedIndex === question.answer) {
    cards[selectedIndex].classList.add('correct');
    playSound('correct');
    gameScore += 10;
    document.getElementById('gameScore').textContent = gameScore;
    feedback.textContent = '🎉 太棒了！答對了！';
    feedback.className = 'text-center handwrite text-xl md:text-2xl text-green-600 min-h-[40px]';
    
    if (question.fullText) {
      speak(question.fullText);
    } else if (question.options && question.options[question.answer]) {
      speak(question.options[question.answer]);
    }
    
    setTimeout(function() {
      nextQuestion();
    }, 1500);
  } else {
    cards[selectedIndex].classList.add('wrong');
    cards[question.answer].classList.add('correct');
    playSound('wrong');
    feedback.textContent = '😅 再想想看，正確答案是「' + question.options[question.answer] + '」';
    feedback.className = 'text-center handwrite text-xl md:text-2xl text-red-600 min-h-[40px]';
    
    setTimeout(function() {
      nextQuestion();
    }, 2000);
  }
}

function nextQuestion() {
  var level = gameLevels[currentGameLevel];
  currentQuestionIndex++;
  
  if (currentQuestionIndex >= level.questions.length) {
    currentGameLevel++;
    currentQuestionIndex = 0;
    
    if (currentGameLevel >= gameLevels.length) {
      showGameComplete();
    } else {
      playSound('win');
      document.getElementById('gameFeedback').textContent = '🎊 ' + level.name + ' 完成！準備進入下一關！';
      setTimeout(function() { renderGameQuestion(); }, 1500);
    }
  } else {
    renderGameQuestion();
  }
}

        '<div class="text-center"><div class="text-red-600">馬</div><div class="text-base md:text-lg text-amber-600">🐴 白馬</div></div>' +
        '<div class="text-center"><div class="text-green-600">螞</div><div class="text-base md:text-lg text-amber-600">🐜 螞蟻</div></div>' +
        '<div class="text-center"><div class="text-pink-600">媽</div><div class="text-base md:text-lg text-amber-600">👩 媽媽</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="flex flex-wrap justify-center gap-4">' +
      '<button onclick="startPractice()" class="hand-drawn-btn bg-yellow-200 px-6 py-4 text-xl touch-feedback">🔄 再玩一次</button>' +
      '<button onclick="startGame()" class="hand-drawn-btn bg-blue-200 px-6 py-4 text-xl touch-feedback">📖 重讀故事</button>' +
      '<button onclick="goHome()" class="hand-drawn-btn bg-pink-200 px-6 py-4 text-xl touch-feedback">🏠 回首頁</button>' +
    '</div>' +
  '</div>';
}

function restartGame() {
  playSound('click');
  gameScore = 0;
  currentGameLevel = 0;
  currentQuestionIndex = 0;
  showPage('gamePage');
  renderGameQuestion();
  // 显示明确的反馈
  var feedback = document.getElementById('gameFeedback');
  feedback.textContent = '🔄 遊戲已重新開始！';
  feedback.className = 'text-center handwrite text-xl md:text-2xl text-blue-600 min-h-[40px]';
}

document.getElementById('soundToggle').addEventListener('click', function() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
  if (soundEnabled) {
    playSound('click');
  }
});

document.getElementById('homeBtn').addEventListener('click', goHome);

if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = function() {
    window.speechSynthesis.getVoices();
  };
}

// 页面加载时预渲染游戏内容，确保按钮点击有可见反馈
document.addEventListener('DOMContentLoaded', function() {
  renderGameQuestion();
});

// 首次交互自动初始化音频
var audioInitialized = false;
function autoInitAudio() {
  if (!audioInitialized) {
    audioInitialized = true;
    initAudio();
  }
}
document.addEventListener('click', autoInitAudio, { once: true });
document.addEventListener('touchstart', autoInitAudio, { once: true });

var lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
  var now = Date.now();
  if (now - lastTouchEnd <= 300) {
    e.preventDefault();
  }
  lastTouchEnd = now;
}, { passive: false });
</script>

</body>
</html>
