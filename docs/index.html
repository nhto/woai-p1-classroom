  html{-webkit-text-size-adjust:100%;}

  .deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .deco svg{position:absolute;}
  .deco .c1{top:4%;left:4%;width:120px;animation:floaty 7s ease-in-out infinite;}
  .deco .c2{top:12%;right:5%;width:96px;animation:floaty 8s ease-in-out infinite reverse;}
  .deco .c3{bottom:8%;left:3%;width:110px;animation:floaty 9s ease-in-out infinite;}
  .deco .c4{bottom:14%;right:4%;width:90px;animation:floaty 7.5s ease-in-out infinite reverse;}
  .deco .s1{top:8%;left:48%;width:34px;}
  .deco .s2{top:46%;left:2%;width:26px;}
  .deco .s3{top:60%;right:3%;width:30px;}
  .deco .s4{top:30%;right:12%;width:24px;}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:34px 18px 60px;}
  header{text-align:center;margin-bottom:26px;}
  .sunbadge{display:inline-block;margin-bottom:8px;animation:spin-soft 14s linear infinite;}

  .school{display:inline-block;font-size:clamp(20px,5.5vw,30px);font-weight:700;letter-spacing:.05em;color:var(--ink);margin-bottom:10px;}
  h1{font-size:clamp(26px,7.5vw,48px);font-weight:700;letter-spacing:.04em;line-height:1.25;display:inline-block;position:relative;}
  h1 .under{display:block;height:11px;background:linear-gradient(90deg,var(--coral),var(--sun),var(--green));border-radius:8px;transform:rotate(-1deg) skewX(-8deg);margin-top:3px;box-shadow:0 2px 0 rgba(91,70,54,.15);}
  .sub{font-size:clamp(15px,4.5vw,19px);font-weight:500;color:var(--ink-soft);margin-top:13px;line-height:1.6;}
  .hint{display:inline-block;margin-top:15px;padding:7px 16px;background:var(--paper);border:2.5px dashed var(--ink);border-radius:30px;font-size:14px;font-weight:700;box-shadow:2px 3px 0 rgba(91,70,54,.12);}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:8px;}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:20px;}}
  @media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr);}}
  .card{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;background:var(--paper);border:3px solid var(--ink);border-radius:26px;padding:16px 10px 14px;text-decoration:none;color:var(--ink);box-shadow:4px 5px 0 rgba(91,70,54,.18);transition:transform .18s ease, box-shadow .18s ease;-webkit-tap-highlight-color:transparent;cursor:pointer;}
  .tile:nth-child(odd) .card{transform:rotate(-1.2deg);}
  .tile:nth-child(even) .card{transform:rotate(1deg);}
  .card:hover,.card:focus-visible{transform:rotate(0deg) translateY(-6px) scale(1.03);box-shadow:7px 9px 0 rgba(91,70,54,.22);outline:none;}
  .card:active{transform:translateY(1px) scale(.97);box-shadow:2px 3px 0 rgba(91,70,54,.2);}
  .icon{width:clamp(74px,22vw,110px);height:clamp(74px,22vw,110px);border-radius:50%;background:#fff;border:3px dashed var(--ink);padding:7px;overflow:hidden;box-shadow:0 3px 0 rgba(91,70,54,.14);transition:transform .18s ease;}
  .card:hover .icon{transform:scale(1.06) rotate(-3deg);}
  .icon img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
  .title{margin-top:11px;font-size:clamp(14px,4.4vw,17px);font-weight:700;line-height:1.4;letter-spacing:.03em;}
  .tip{margin-top:5px;font-size:clamp(11px,3.4vw,13px);color:var(--ink-soft);font-weight:500;}
  .tag{position:absolute;top:-11px;right:8px;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);box-shadow:0 2px 0 rgba(91,70,54,.14);}
  .c-sun{background:var(--sun);}.c-sky{background:var(--sky);}.c-green{background:var(--green);}.c-coral{background:var(--coral);}.c-peach{background:var(--peach);}.c-grape{background:var(--grape);}.c-mint{background:var(--mint);}
  .card.congrats{background:#FFF3C9;border-style:double;border-width:4px;transform:rotate(.6deg);}
  .congrats:hover,.congrats:focus-visible{transform:rotate(0deg) translateY(-6px) scale(1.03);}
  .congrats .icon{background:linear-gradient(135deg,#FFF7D6,#FFE9A8);}
  .congrats .icon svg{width:100%;height:100%;}
  .tile{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0;}
  .qrbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:2.5px solid var(--ink);border-radius:30px;background:var(--paper);color:var(--ink);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;min-height:44px;box-shadow:2px 3px 0 rgba(91,70,54,.15);transition:transform .16s ease, box-shadow .16s ease;-webkit-tap-highlight-color:transparent;}
  .qrbtn:hover,.qrbtn:focus-visible{transform:translateY(-3px);box-shadow:3px 5px 0 rgba(91,70,54,.2);outline:none;}
  .qrbtn:active{transform:translateY(1px) scale(.97);}
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(91,70,54,.4);}
  .modal.show{display:flex;}
  .modal-card{background:var(--paper);border:3px solid var(--ink);border-radius:28px;padding:24px 20px 22px;width:min(350px,92vw);text-align:center;position:relative;box-shadow:6px 8px 0 rgba(91,70,54,.25);}
  .modal-close{position:absolute;top:-15px;right:-12px;width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;color:var(--ink);font-size:24px;line-height:1;cursor:pointer;box-shadow:0 2px 0 rgba(91,70,54,.2);-webkit-tap-highlight-color:transparent;}
  .modal-close:hover{transform:scale(1.08);}
  .modal-title{font-size:22px;font-weight:700;margin-bottom:14px;letter-spacing:.03em;}
  .qr-frame{display:inline-block;background:#fff;border:3px dashed var(--ink);border-radius:18px;padding:12px;}
  .qr-frame #qrCanvas{display:inline-block;width:min(220px,60vw);min-height:160px;}
  .qr-frame #qrCanvas img,.qr-frame #qrCanvas canvas{display:block;margin:0 auto;border-radius:10px;max-width:100%;height:auto;}
  .modal-hint{margin-top:14px;font-size:14px;color:var(--ink-soft);line-height:1.6;}
  .modal-link{display:inline-block;margin-top:13px;padding:9px 18px;border-radius:24px;background:var(--sun);border:2.5px solid var(--ink);color:var(--ink);font-weight:700;text-decoration:none;font-size:15px;box-shadow:2px 3px 0 rgba(91,70,54,.15);}
  .modal-link:active{transform:translateY(1px);}
  footer{text-align:center;margin-top:36px;color:var(--ink-soft);font-size:13px;line-height:1.8;position:relative;z-index:1;}
  footer .starline{letter-spacing:.2em;color:var(--sun);font-size:16px;}
  .burst{position:fixed;z-index:50;pointer-events:none;font-size:30px;animation:pop 1s ease-out forwards;}
  @keyframes pop{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
  @media (prefers-reduced-motion: reduce){.deco svg{animation:none;}.sunbadge{animation:none;}.card,.icon{transition:none;}}
</style>
</head>

<script src="https://fastly.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
  (function(){
    var btn = document.getElementById('congratsBtn');
    var colors = ['#FF9AA2','#FFD25A','#9CD49A','#C7B7F0','#FF8A5C'];
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function makeStar(col,size){
      var el = document.createElement('span');
      el.className='burst';
      el.style.width=el.style.height=size+'px';
      el.innerHTML = '<svg width="'+size+'" height="'+size+'" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 L23.5 15 L37 20 L23.5 25 L20 38 L16.5 25 L3 20 L16.5 15 Z" fill="'+col+'" stroke="#5B4636" stroke-width="2.5" stroke-linejoin="round"/></svg>';
      return el;
    }
    function burst(e){
      if(reduced) return;
      var r = btn.getBoundingClientRect();
      var cx = r.left + r.width/2, cy = r.top + r.height/2;
      for(var i=0;i<18;i++){
        var s = makeStar(colors[i%colors.length], 20+Math.random()*26);
        s.style.left = cx+'px'; s.style.top = cy+'px';
        var ang = Math.random()*Math.PI*2;
        var dist = 70 + Math.random()*130;
        s.style.setProperty('--dx', (Math.cos(ang)*dist)+'px');
        s.style.setProperty('--dy', (Math.sin(ang)*dist - 30)+'px');
        document.body.appendChild(s);
        (function(el){setTimeout(function(){el.remove();},1000);})(s);
      }
    }
    btn.addEventListener('click', burst);
    var modal = document.getElementById('qrModal');
    var modalTitle = document.getElementById('qrTitle');
    var qrOpen = document.getElementById('qrOpen');
    var qrClose = document.getElementById('qrClose');
    var qrBtns = document.querySelectorAll('.qrbtn');
    var GAMES = [
      "我愛學語文課文互動遊戲/大雨傘_Q版手繪互動遊戲.html",
      "我愛學語文課文互動遊戲/小熊住山洞_互動遊戲.html",
      "我愛學語文課文互動遊戲/百合花情景互動遊戲.html",
      "我愛學語文課文互動遊戲/青字歌情景互動識字遊戲.html",
      "我愛學語文課文互動遊戲/春天的圖畫_繪本互動遊戲.html",
      "我愛學語文課文互動遊戲/馬字歌互動教學遊戲.html",
      "我愛學語文課文互動遊戲/超級市場裡學生字互動遊戲.html",
      "我愛學語文課文互動遊戲/鞋_互動教學遊戲.html",
      "我愛學語文課文互動遊戲/燕子媽媽笑了-互動遊戲.html"
    ];
    var qrCanvas = document.getElementById('qrCanvas');
    function openQr(idx, title){
      modalTitle.textContent = title;
      var rel = GAMES[idx];
      qrOpen.href = rel;
      qrCanvas.innerHTML = '';
      if(window.QRCode && rel){
        var absUrl = new URL(rel, location.href).href;
        new QRCode(qrCanvas, {
          text: absUrl,
          width: 200,
          height: 200,
          colorDark: "#5B4636",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      }
      modal.classList.add('show');
      modal.setAttribute('aria-hidden','false');
      qrClose.focus();
    }
    function closeQr(){ modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); }
    qrBtns.forEach(function(b){ b.addEventListener('click', function(){ openQr(parseInt(b.getAttribute('data-index'),10), b.getAttribute('data-title')); }); });
    qrClose.addEventListener('click', closeQr);
    modal.addEventListener('click', function(e){ if(e.target === modal){ closeQr(); } });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && modal.classList.contains('show')){ closeQr(); } });
  })();
</script>
